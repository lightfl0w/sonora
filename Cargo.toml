[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
sonora-core = { path = "crates/sonora-core" }
sonora-dsp = { path = "crates/sonora-dsp" }
sonora-engine = { path = "crates/sonora-engine" }
sonora-audio = { path = "crates/sonora-audio" }
sonora-midi = { path = "crates/sonora-midi" }
sonora-project = { path = "crates/sonora-project" }
sonora-ui = { path = "crates/sonora-ui" }
sonora-app = { path = "crates/sonora-app" }

cpal = "0.18.2"
crossbeam-queue = "0.3.14"
gpui-fast = "0.1.17"
gpui-fast-platform = "0.1.17"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
